name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies with npm 10.9.2
        run: npx --yes npm@10.9.2 ci --no-audit --no-fund

      - name: Install Compact 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.31.1

      - name: Compile Compact contract
        run: |
          compact compile contracts/counter.compact managed
          npx --yes npm@10.9.2 run sync:zk

      - name: Verify compiled artifacts are committed
        run: |
          npx --yes npm@10.9.2 run test:artifacts
          git diff --exit-code -- managed public/zk

      - name: Contract tests
        run: npx --yes npm@10.9.2 test

      - name: Verify Level 3 file structure
        run: npx --yes npm@10.9.2 run check:structure

      - name: Typecheck
        run: npx --yes npm@10.9.2 run typecheck

      - name: Build frontend
        run: npx --yes npm@10.9.2 run build
