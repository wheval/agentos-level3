name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned so the lockfile is always resolved by the same npm that generated
      # it. npm 11 prunes optional peer deps (smoldot) that npm 10 requires.
      - run: npm install -g npm@10.9.2

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm test

      - name: Verify committed artifacts match the contract source
        run: npm run test:artifacts

      - name: Build frontend
        run: npm run build
